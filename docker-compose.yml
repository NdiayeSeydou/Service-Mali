services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mali_services}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-mali_services}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  backend:
    build: ./backend
    env_file: .env
    environment: {POSTGRES_HOST: db, CELERY_BROKER_URL: redis://redis:6379/0, CELERY_RESULT_BACKEND: redis://redis:6379/1}
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes: [./backend:/app, uploads:/app/media]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  celery:
    build: ./backend
    env_file: .env
    environment: {POSTGRES_HOST: db, CELERY_BROKER_URL: redis://redis:6379/0, CELERY_RESULT_BACKEND: redis://redis:6379/1}
    command: celery -A config worker -l info
    volumes: [./backend:/app]
    depends_on: {backend: {condition: service_started}, redis: {condition: service_healthy}}
  celery-beat:
    build: ./backend
    env_file: .env
    environment: {POSTGRES_HOST: db, CELERY_BROKER_URL: redis://redis:6379/0, CELERY_RESULT_BACKEND: redis://redis:6379/1}
    command: celery -A config beat -l info
    volumes: [./backend:/app]
    depends_on: {backend: {condition: service_started}, redis: {condition: service_healthy}}
  frontend:
    build: ./frontend
    depends_on: [backend]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro, uploads:/usr/share/nginx/html/media:ro]
    depends_on: [backend, frontend]
volumes:
  postgres_data:
  uploads:
